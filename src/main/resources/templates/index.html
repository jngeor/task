<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tareas</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center mb-4">Tareas</h1>
    <h4 class="mb-3">Crear nueva tarea</h4>

    <table class="table table-bordered">
        <thead class="table-success">
        <tr>
            <th>Descripción</th>
            <th>Iniciado</th>
            <th>Acción</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="t : ${tareas}">
            <td th:text="${t.description}"></td>
            <td th:text="${t.state}"></td>
            <td>
                <a th:href="@{'/tareas/eliminar/' + ${t.id}}"
                   class="btn btn-danger btn-sm">eliminar</a>

                <a th:href="@{'/tareas/iniciar/' + ${t.id}}"
                   class="btn btn-success btn-sm">iniciar</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
